name: Activate enhanced dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add dashboard patch import
        shell: bash
        run: |
          if ! grep -q '^import dashboard_patch$' app.py; then
            python - <<'PY'
from pathlib import Path
p = Path('app.py')
s = p.read_text()
needle = '\nif __name__ == "__main__":\n    main()\n'
if needle not in s:
    raise SystemExit('Could not locate app.py entrypoint')
s = s.replace(needle, '\nimport dashboard_patch\n\nif __name__ == "__main__":\n    main()\n')
p.write_text(s)
PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app.py
            git commit -m 'Activate enhanced dashboard at startup'
            git push
          else
            echo 'dashboard_patch already active'
          fi
