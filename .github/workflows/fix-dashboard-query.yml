name: Fix dashboard query

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch dashboard SQL
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app.py")
          s = p.read_text()
          old = "ORDER BY referrals DESC, activity DESC, u.created_at ASC LIMIT 20"
          new = "ORDER BY referrals DESC, activity DESC LIMIT 20"
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          if git diff --quiet -- app.py; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Fix dashboard referrer query"
          git push